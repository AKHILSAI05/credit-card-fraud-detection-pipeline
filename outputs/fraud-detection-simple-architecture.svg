<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #17365d; }
      .head { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #17365d; text-anchor: middle; }
      .sub { font-family: Arial, sans-serif; font-size: 17px; fill: #35566f; text-anchor: middle; }
      .smallhead { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #17365d; }
      .small { font-family: Arial, sans-serif; font-size: 16px; fill: #35566f; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/></marker>
  </defs>
  <rect width="1600" height="1800" fill="#ffffff"/>
  <text x="800" y="70" text-anchor="middle" class="title">Credit Card Fraud Detection - End-to-End Data Pipeline</text>
  <text x="800" y="105" text-anchor="middle" class="sub">Core pipeline with mandatory orchestration, audit logging, and validation</text>

  <!-- Main flow boxes -->
  <g stroke="#a6a6a6" stroke-width="2">
    <rect x="260" y="155" width="800" height="105" rx="15" fill="#f3f1eb"/>
    <rect x="260" y="335" width="800" height="105" rx="15" fill="#f3f1eb"/>
    <rect x="260" y="515" width="800" height="105" rx="15" fill="#dff3ee" stroke="#4eaaa0"/>
    <rect x="260" y="695" width="800" height="105" rx="15" fill="#dff3ee" stroke="#4eaaa0"/>
    <rect x="260" y="875" width="800" height="105" rx="15" fill="#f3f1eb"/>
    <rect x="260" y="1055" width="800" height="105" rx="15" fill="#dff3ee" stroke="#4eaaa0"/>
    <rect x="260" y="1235" width="800" height="105" rx="15" fill="#dff3ee" stroke="#4eaaa0"/>
  </g>
  <text x="660" y="198" class="head">Kaggle Credit Card Fraud Dataset</text>
  <text x="660" y="230" class="sub">Source: Time, V1-V28, Amount, Class</text>
  <text x="660" y="378" class="head">AWS S3 Landing Zone</text>
  <text x="660" y="410" class="sub">landing/ | archive/ | reject/</text>
  <text x="660" y="558" class="head">Databricks Bronze Layer</text>
  <text x="660" y="590" class="sub">bronze.transactions_raw - raw ingestion and source audit columns</text>
  <text x="660" y="738" class="head">Databricks Silver Layer</text>
  <text x="660" y="770" class="sub">silver.transactions_enriched - validate, clean, enrich, rule-based risk score</text>
  <text x="660" y="918" class="head">Snowflake Staging Layer</text>
  <text x="660" y="950" class="sub">RAW.TRANSACTIONS - received transaction records loaded from Databricks</text>
  <text x="660" y="1098" class="head">Snowflake Analytics / Gold Layer</text>
  <text x="660" y="1130" class="sub">Fact and dimension tables, risk views, high-risk queue, daily fraud summary</text>
  <text x="660" y="1278" class="head">Business Consumption</text>
  <text x="660" y="1310" class="sub">Fraud analyst review | Snowflake worksheets / dashboard | live demo</text>

  <!-- Arrows -->
  <g stroke="#7b8794" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M660 260 L660 335"/><path d="M660 440 L660 515"/><path d="M660 620 L660 695"/>
    <path d="M660 800 L660 875"/><path d="M660 980 L660 1055"/><path d="M660 1160 L660 1235"/>
  </g>

  <!-- Orchestration -->
  <rect x="160" y="1435" width="1280" height="230" rx="16" fill="#eaf1fb" stroke="#2f75b5" stroke-width="3"/>
  <text x="800" y="1485" class="head">Mandatory Orchestration and Monitoring - Databricks Workflows</text>
  <g fill="#ffffff" stroke="#2f75b5" stroke-width="2">
    <rect x="210" y="1530" width="200" height="72" rx="10"/><rect x="435" y="1530" width="200" height="72" rx="10"/>
    <rect x="660" y="1530" width="200" height="72" rx="10"/><rect x="885" y="1530" width="200" height="72" rx="10"/>
    <rect x="1110" y="1530" width="280" height="72" rx="10"/>
  </g>
  <text x="310" y="1560" class="smallhead" text-anchor="middle">1. Check audit log</text>
  <text x="310" y="1584" class="small" text-anchor="middle">new file or duplicate?</text>
  <text x="535" y="1560" class="smallhead" text-anchor="middle">2. Ingest Bronze</text>
  <text x="535" y="1584" class="small" text-anchor="middle">raw + audit columns</text>
  <text x="760" y="1560" class="smallhead" text-anchor="middle">3. Build Silver</text>
  <text x="760" y="1584" class="small" text-anchor="middle">validate and enrich</text>
  <text x="985" y="1560" class="smallhead" text-anchor="middle">4. Load Snowflake</text>
  <text x="985" y="1584" class="small" text-anchor="middle">Raw then Analytics</text>
  <text x="1250" y="1560" class="smallhead" text-anchor="middle">5. Reconcile and alert</text>
  <text x="1250" y="1584" class="small" text-anchor="middle">row counts, logs, retries, status</text>
  <g stroke="#2f75b5" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M410 1566 L435 1566"/><path d="M635 1566 L660 1566"/><path d="M860 1566 L885 1566"/><path d="M1085 1566 L1110 1566"/>
  </g>
  <text x="800" y="1640" class="sub">Audit control: ops.processed_files prevents duplicate file processing. S3 stores files; Databricks checks the audit log.</text>
  <text x="800" y="1715" class="small" text-anchor="middle">Solid arrows show required data flow. The optional bonus natural-language SQL website is intentionally not shown here.</text>
</svg>
