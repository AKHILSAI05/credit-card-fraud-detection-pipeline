<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450">
 <defs>
  <style>
   .bg{fill:#f7f9fc}.title{font:700 38px Arial,sans-serif;fill:#142b4a}.sub{font:17px Arial,sans-serif;fill:#526b84}.lane{font:700 18px Arial,sans-serif;fill:#243b53}.head{font:700 20px Arial,sans-serif;fill:#102a43}.body{font:15px Arial,sans-serif;fill:#243b53}.small{font:13px Arial,sans-serif;fill:#486581}.tiny{font:12px Arial,sans-serif;fill:#486581}.card{fill:white;stroke:#b9c6d5;stroke-width:2}.aws{fill:#fff7e8;stroke:#e7a51c;stroke-width:3}.dbx{fill:#fff0ed;stroke:#e05435;stroke-width:3}.snow{fill:#edf7ff;stroke:#2376bf;stroke-width:3}.gold{fill:#edf9f0;stroke:#258a52;stroke-width:3}.dag{fill:#f4efff;stroke:#7653b7;stroke-width:3}.ops{fill:#f3f6f9;stroke:#7f95aa;stroke-width:2}.flow{stroke:#344e68;stroke-width:4;fill:none}.orch{stroke:#7653b7;stroke-width:3;stroke-dasharray:10 7;fill:none}.success{stroke:#258a52;stroke-width:4;fill:none}.failure{stroke:#cf3f45;stroke-width:4;fill:none}.section{fill:#e7eef5}.rule{stroke:#d9e2ec;stroke-width:2}.badge{fill:#142b4a}.badgeText{font:700 13px Arial,sans-serif;fill:white}.label{font:700 13px Arial,sans-serif;fill:#334e68}.ok{font:700 14px Arial,sans-serif;fill:#1f7a46}.bad{font:700 14px Arial,sans-serif;fill:#be2f36}
  </style>
  <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 Z" fill="#344e68"/></marker>
  <marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 Z" fill="#7653b7"/></marker>
  <marker id="as" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 Z" fill="#258a52"/></marker>
  <marker id="af" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 Z" fill="#cf3f45"/></marker>
 </defs>
 <rect width="2200" height="1450" class="bg"/>
 <text x="1100" y="57" text-anchor="middle" class="title">Credit Card Fraud Detection — Final Data Engineering Architecture</text>
 <text x="1100" y="87" text-anchor="middle" class="sub">AWS S3 • Databricks Bronze/Silver • Snowflake RAW/Gold • Dagster orchestration • Native Streamlit analytics</text>

 <!-- DATA FLOW LANE -->
 <rect x="40" y="125" width="2120" height="470" rx="20" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
 <rect x="40" y="125" width="2120" height="44" rx="20" class="section"/>
 <text x="67" y="154" class="lane">A. Primary Data Flow — every arrow is a required data dependency</text>

 <!-- nodes -->
 <rect x="75" y="235" width="220" height="230" rx="15" class="card"/>
 <rect x="75" y="235" width="220" height="38" rx="15" class="badge"/><text x="185" y="260" text-anchor="middle" class="badgeText">1. DATA SOURCE</text>
 <text x="95" y="306" class="head">Kaggle ULB Dataset</text><text x="95" y="335" class="body">creditcard.csv</text>
 <line x1="95" y1="355" x2="275" y2="355" class="rule"/><text x="95" y="383" class="small">Time · V1–V28 · Amount · Class</text><text x="95" y="407" class="tiny">Class is a historical label only</text><text x="95" y="430" class="tiny">V1–V28 are anonymised features</text>

 <rect x="350" y="205" width="285" height="310" rx="15" class="aws"/>
 <rect x="350" y="205" width="285" height="38" rx="15" class="badge"/><text x="492" y="230" text-anchor="middle" class="badgeText">2. AWS S3 LANDING ZONE</text>
 <text x="372" y="278" class="small">intern-final-project-fraud-detection</text>
 <rect x="372" y="300" width="240" height="45" rx="8" fill="white"/><text x="390" y="329" class="body">landing/ — incoming CSV</text>
 <rect x="372" y="360" width="240" height="45" rx="8" fill="white"/><text x="390" y="389" class="body">archive/ — success only</text>
 <rect x="372" y="420" width="240" height="70" rx="8" fill="white"/><text x="390" y="449" class="body">reject/duplicates/</text><text x="390" y="472" class="small">reject/validation_failed/</text>

 <rect x="690" y="205" width="300" height="310" rx="15" class="dbx"/>
 <rect x="690" y="205" width="300" height="38" rx="15" class="badge"/><text x="840" y="230" text-anchor="middle" class="badgeText">3. DATABRICKS BRONZE</text>
 <text x="713" y="274" class="head">workspace.bronze</text><rect x="713" y="292" width="250" height="42" rx="8" fill="white"/><text x="728" y="320" class="body">transactions_raw</text>
 <text x="713" y="365" class="small">Raw, append-only source preservation</text><text x="713" y="389" class="tiny">+ source_file, source_s3_uri, batch_id</text><text x="713" y="410" class="tiny">+ load_ts, ingestion_date, pipeline_run_id</text><text x="713" y="431" class="tiny">+ content_sha256, source_etag, file_size_bytes</text><text x="713" y="475" class="ok">All source rows retained in Bronze</text>

 <rect x="1045" y="205" width="300" height="310" rx="15" class="dbx"/>
 <rect x="1045" y="205" width="300" height="38" rx="15" class="badge"/><text x="1195" y="230" text-anchor="middle" class="badgeText">4. DATABRICKS SILVER</text>
 <text x="1068" y="274" class="head">workspace.silver</text><rect x="1068" y="292" width="250" height="42" rx="8" fill="white"/><text x="1082" y="319" class="small">transactions_silver_incremental</text>
 <text x="1068" y="365" class="small">Clean and business-ready transactions</text><text x="1068" y="389" class="tiny">Type standardisation + synthetic timestamp</text><text x="1068" y="410" class="tiny">Exact duplicate row removal happens here</text><text x="1068" y="431" class="tiny">Amount, time, rapid-repeat, risk features</text><text x="1068" y="475" class="ok">One successful Silver record per batch</text>

 <rect x="1400" y="205" width="260" height="310" rx="15" class="snow"/>
 <rect x="1400" y="205" width="260" height="38" rx="15" class="badge"/><text x="1530" y="230" text-anchor="middle" class="badgeText">5. SNOWFLAKE RAW</text>
 <text x="1423" y="274" class="head">FRAUD_DB.RAW</text><rect x="1423" y="292" width="210" height="42" rx="8" fill="white"/><text x="1440" y="320" class="body">TRANSACTIONS</text>
 <text x="1423" y="370" class="small">Guarded append of new batch only</text><text x="1423" y="394" class="tiny">Batch/file duplicate guard</text><text x="1423" y="415" class="tiny">Silver → RAW reconciliation</text><text x="1423" y="436" class="tiny">Audit fields carried for traceability</text>

 <rect x="1715" y="190" width="400" height="335" rx="15" class="gold"/>
 <rect x="1715" y="190" width="400" height="38" rx="15" class="badge"/><text x="1915" y="215" text-anchor="middle" class="badgeText">6. SNOWFLAKE GOLD / ANALYTICS</text>
 <text x="1738" y="260" class="head">FRAUD_DB.ANALYTICS</text><text x="1738" y="290" class="small">Gold tables — dashboard aggregations</text>
 <text x="1738" y="315" class="tiny">• FRAUD_DAILY_SUMMARY</text><text x="1738" y="338" class="tiny">• AMOUNT_BUCKET_SUMMARY</text><text x="1738" y="361" class="tiny">• RISK_TIME_DASHBOARD</text>
 <text x="1738" y="396" class="small">Live view — analyst workflow</text><text x="1738" y="420" class="tiny">• ANALYST_REVIEW_QUEUE</text><text x="1738" y="467" class="tiny">Procedure: ANALYTICS.REFRESH_FRAUD_GOLD()</text>

 <path d="M295 345 L350 345" class="flow" marker-end="url(#a)"/><text x="323" y="326" text-anchor="middle" class="label">upload</text>
 <path d="M635 345 L690 345" class="flow" marker-end="url(#a)"/><text x="662" y="326" text-anchor="middle" class="label">read file</text>
 <path d="M990 345 L1045 345" class="flow" marker-end="url(#a)"/><text x="1017" y="326" text-anchor="middle" class="label">transform</text>
 <path d="M1345 345 L1400 345" class="flow" marker-end="url(#a)"/><text x="1372" y="326" text-anchor="middle" class="label">new batch</text>
 <path d="M1660 345 L1715 345" class="flow" marker-end="url(#a)"/><text x="1687" y="326" text-anchor="middle" class="label">refresh Gold</text>

 <!-- Streamlit -->
 <rect x="640" y="555" width="920" height="120" rx="18" class="gold"/>
 <text x="1100" y="595" text-anchor="middle" class="head">7. Business Consumption — Snowflake Native Streamlit</text><text x="1100" y="623" text-anchor="middle" class="body">FRAUD_RISK_DASHBOARD</text><text x="1100" y="650" text-anchor="middle" class="small">Interactive filters, KPI cards, daily overview, risk/time, amount analysis, review queue, top-100 review, export</text>
 <path d="M1915 525 L1915 540 L1560 540 L1560 598" class="flow" marker-end="url(#a)"/>

 <!-- Dagster lane -->
 <rect x="40" y="735" width="2120" height="270" rx="20" class="dag"/>
 <text x="75" y="775" class="lane">B. Mandatory Orchestration — Dagster local deployment</text><text x="75" y="800" class="small">landing_file_sensor detects one eligible S3 CSV approximately every 30 seconds and starts fraud_pipeline_job with dynamic parameters.</text>
 <rect x="85" y="850" width="220" height="85" rx="12" class="card"/><text x="195" y="883" text-anchor="middle" class="head">Sensor</text><text x="195" y="908" text-anchor="middle" class="small">landing_file_sensor</text><text x="195" y="927" text-anchor="middle" class="tiny">object metadata + SHA-256</text>
 <rect x="350" y="850" width="220" height="85" rx="12" class="card"/><text x="460" y="883" text-anchor="middle" class="head">1. run_bronze</text><text x="460" y="908" text-anchor="middle" class="small">Databricks Bronze Job</text>
 <rect x="615" y="850" width="220" height="85" rx="12" class="card"/><text x="725" y="883" text-anchor="middle" class="head">2. run_silver</text><text x="725" y="908" text-anchor="middle" class="small">Databricks Silver Job</text>
 <rect x="880" y="850" width="245" height="85" rx="12" class="card"/><text x="1002" y="883" text-anchor="middle" class="head">3. load_snowflake_raw</text><text x="1002" y="908" text-anchor="middle" class="small">Guarded Silver → RAW load</text>
 <rect x="1170" y="850" width="245" height="85" rx="12" class="card"/><text x="1292" y="883" text-anchor="middle" class="head">4. validate_raw</text><text x="1292" y="908" text-anchor="middle" class="small">Silver ↔ RAW reconciliation</text>
 <rect x="1460" y="850" width="215" height="85" rx="12" class="card"/><text x="1568" y="883" text-anchor="middle" class="head">5. refresh_gold</text><text x="1568" y="908" text-anchor="middle" class="small">Snowflake procedure</text>
 <rect x="1720" y="850" width="385" height="85" rx="12" class="card"/><text x="1912" y="883" text-anchor="middle" class="head">6. archive_processed_file</text><text x="1912" y="908" text-anchor="middle" class="small">archive success + remove landing source</text>
 <path d="M305 892 L350 892 M570 892 L615 892 M835 892 L880 892 M1125 892 L1170 892 M1415 892 L1460 892 M1675 892 L1720 892" class="flow" marker-end="url(#a)"/>
 <text x="1100" y="975" text-anchor="middle" class="small">Strict dependency order • retries on transient failures • run logs • step status • no next step after a failed predecessor</text>

 <!-- connections from orchestration -->
 <path d="M195 850 L195 690 L492 690 L492 515" class="orch" marker-end="url(#ao)"/><path d="M460 850 L460 710 L840 710 L840 515" class="orch" marker-end="url(#ao)"/><path d="M725 850 L725 720 L1195 720 L1195 515" class="orch" marker-end="url(#ao)"/><path d="M1002 850 L1002 730 L1530 730 L1530 515" class="orch" marker-end="url(#ao)"/><path d="M1568 850 L1568 735 L1915 735 L1915 525" class="orch" marker-end="url(#ao)"/>

 <!-- Controls lane -->
 <rect x="40" y="1065" width="680" height="300" rx="18" class="ops"/>
 <text x="70" y="1105" class="head">C. Audit, Validation and Lineage</text><text x="70" y="1140" class="body">Audit tables</text><text x="70" y="1163" class="small">• workspace.ops.processed_files — Bronze file-level audit</text><text x="70" y="1186" class="small">• workspace.ops.silver_processed_batches — Silver batch audit</text><text x="70" y="1220" class="body">Validation evidence</text><text x="70" y="1243" class="small">• source → Bronze count, null/value checks, content checks</text><text x="70" y="1266" class="small">• Bronze → Silver count and exact duplicate checks</text><text x="70" y="1289" class="small">• Silver → Snowflake RAW reconciliation</text><text x="70" y="1322" class="tiny">Audit columns: source file, URI, batch, timestamps, run ID, status, counts, error</text>

 <rect x="760" y="1065" width="680" height="300" rx="18" class="ops"/>
 <text x="790" y="1105" class="head">D. Duplicate Prevention and Exception Routing</text><text x="790" y="1140" class="body">File-level controls before processing</text>
 <text x="790" y="1164" class="small">1. Sensor cursor prevents repeated S3 event submission.</text><text x="790" y="1187" class="small">2. Source URI / filename audit prevents the same S3 object loading again.</text><text x="790" y="1210" class="small">3. SHA-256 identifies identical file content even under a new filename.</text><text x="790" y="1233" class="small">4. Snowflake guarded append prevents a duplicate batch/file load.</text>
 <text x="790" y="1268" class="body">Record-level data handling</text><text x="790" y="1291" class="small">Bronze preserves raw rows; Silver removes only exact duplicate transaction rows.</text>
 <text x="790" y="1322" class="bad">Duplicate content → reject/duplicates/  |  Invalid/failed processing → reject/validation_failed/</text>

 <rect x="1480" y="1065" width="680" height="300" rx="18" class="ops"/>
 <text x="1510" y="1105" class="head">E. Security, Reliability and Tools</text><text x="1510" y="1140" class="small">AWS IAM least privilege: list/read landing; write archive/reject; delete only processed landing source.</text><text x="1510" y="1170" class="small">Databricks external location + IAM role controls S3 data access.</text><text x="1510" y="1200" class="small">Credentials stay in .env / Databricks secrets; never commit tokens/passwords to Git.</text><text x="1510" y="1235" class="body">Tools: AWS S3/IAM • Databricks/Unity Catalog/Jobs • Snowflake SQL/Procedure</text><text x="1510" y="1260" class="body">Snowflake Native Streamlit • Dagster • Python/boto3/REST • GitHub • VS Code • Notion</text><text x="1510" y="1322" class="ok">Operational result: automated, observable, idempotent pipeline with analyst-ready output.</text>

 <!-- Success / failure outcome relations -->
 <path d="M1912 935 L1912 1040 L520 1040 L520 515" class="success" marker-end="url(#as)"/><text x="745" y="1032" class="ok">success: archive only after complete Gold refresh</text>
 <path d="M195 850 L195 1018 L580 1018 L580 475" class="failure" marker-end="url(#af)"/><text x="265" y="1009" class="bad">duplicate or validation failure: route to reject</text>

 <line x1="70" y1="1410" x2="125" y2="1410" class="flow" marker-end="url(#a)"/><text x="140" y="1415" class="small">required data / job dependency</text><line x1="500" y1="1410" x2="555" y2="1410" class="orch" marker-end="url(#ao)"/><text x="570" y="1415" class="small">Dagster trigger</text><line x1="815" y1="1410" x2="870" y2="1410" class="success" marker-end="url(#as)"/><text x="885" y="1415" class="small">success route</text><line x1="1110" y1="1410" x2="1165" y2="1410" class="failure" marker-end="url(#af)"/><text x="1180" y="1415" class="small">reject route</text><text x="1880" y="1415" class="small">Final design • 10 Aug 2026</text>
</svg>
