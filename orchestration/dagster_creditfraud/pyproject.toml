[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagster-creditfraud"
version = "0.1.0"
description = "Dagster orchestration for the credit card fraud data pipeline"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster>=1.10,<2.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "snowflake-connector-python>=3.10",
]

[project.optional-dependencies]
dev = ["dagster-webserver>=1.10,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]
